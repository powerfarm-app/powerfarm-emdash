# Powerfarm CI: every pull request and every push to main.
#
#   tests   plugin and Mac bridge tests, the lockfile rule, script syntax (fast, no EmDash build)
#   emdash  Powerfarm on the pinned EmDash: patches apply, no new dependencies, EmDash build,
#           patch tests, typecheck, astro check, seed and migration validation, Worker build,
#           scheduler wiring (scripts/setup.sh, the same script people run)
#
# No secrets, no deploy. Actions are pinned by commit SHA (the same pins EmDash uses).
name: CI

on:
  pull_request:
  push:
    branches: [main]
  merge_group:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  tests:
    name: Plugin and Mac tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 22
      - name: Zod for the route tests (the version EmDash's catalog pins)
        run: |
          mkdir -p "$RUNNER_TEMP/zod"
          npm install --prefix "$RUNNER_TEMP/zod" --no-save --ignore-scripts --no-audit --no-fund zod@4.5.4
          cd "$RUNNER_TEMP/zod"
          echo "POWERFARM_ZOD=$(node --input-type=module -e "console.log(new URL(import.meta.resolve('zod')).pathname)")" >> "$GITHUB_ENV"
      - name: Plugin tests
        working-directory: plugin
        run: node --import ./test/ts-resolve.mjs --experimental-strip-types --no-warnings --test test/*.test.ts
      - name: Mac bridge tests
        working-directory: mac/bridge
        run: node --test test/*.test.mjs
      - name: Scripts parse
        run: for f in scripts/*.mjs; do node --check "$f"; done

  emdash:
    name: Build on pinned EmDash
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 22
      - name: pnpm (the version EmDash pins, through corepack)
        run: corepack enable
      - name: EmDash at the pin, Powerfarm's patches, build and all checks
        run: bash scripts/setup.sh
